l_english:

SOV_medvedev_russian_elections: "New Elections!"
SOV_medvedev_russian_elections_desc: "Hold early State Duma elections and introduce more transparent campaign rules under Medvedev's supervision. This serves as both a stress test for the political system and a signal of reform to domestic and international observers."

SOV_people_russia_chosen: "For the People!"
SOV_people_russia_chosen_desc: "Under the banner of 'People First,' form a government that listens to grassroots voices. From pensions to utility fees, every policy must directly address the most pressing needs of the populace."

SOV_pink_sunset: "Pink Sunset"
SOV_pink_sunset_desc: "A moderate left-wing path: strengthening social security, promoting labor-management consultation, and recognizing pluralistic values. As gentle as twilight, it may nonetheless appear hesitant in times of crisis due to its lack of radical change."

SOV_med_red_dawn: "Red Dawn"
SOV_med_red_dawn_desc: "Break oligarchic capital decisively, and reintroduce core elements of nationalization and planned economy. As the red flag rises once more, it brings both a resolute reckoning with the old order and a fearless exploration of a new world."

SOV_for_new_socialism: "New Socialism"
SOV_for_new_socialism_desc: "Redefining public ownership in the digital age: nationalizing strategic industries, democratizing the platform economy, and guaranteeing universal basic services. This is not a restoration of the Soviet model, but an institutional experiment facing the future."

SOV_democratization_capital: "Democratization of the Capitals"
SOV_democratization_capital_desc: "Taking Moscow and St. Petersburg as pilot zones, restore direct mayoral elections, guarantee freedom of assembly, and establish independent judicial trials. Reform begins in the core cities before cautiously expanding to federal subjects."

SOV_social_populism: "Social Populism"
SOV_social_populism_desc: "A strong leader makes direct promises to the people: raise the minimum wage, freeze energy prices, and severely punish corrupt oligarchs. This approach tightly couples welfare expansion with nationalist narratives—popular yet controversial."

SOV_united_russia_chosen: "United We Stand!"
SOV_united_russia_chosen_desc: "Maintain social stability, prioritize sovereignty, and pursue gradual reforms. In the face of external pressure and internal challenges, national cohesion comes above all else."

SOV_medvedev_path: "Medvedev's Vision"
SOV_medvedev_path_desc: "A blueprint for technocratic governance and legal modernization. Advance the digital economy, optimize administrative efficiency, and restore judicial independence—achieving a 'silent modernization' while preserving systemic stability."

SOV_people_program: "People's Program"
SOV_people_program_desc: "An action agenda gathered from town hall meetings across the regions: build affordable housing, renovate aging infrastructure, and support local small businesses. Every item includes clear funding sources and completion deadlines."